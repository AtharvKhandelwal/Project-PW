<mat-card class="login-card">
  <h2 mat-card-title>Login</h2>

  <form [formGroup]="loginForm" (ngSubmit)="onSubmit()">
    <mat-form-field appearance="outline" class="full-width">
      <mat-label>Email </mat-label>
      <input matInput formControlName="email" type="email" />
      <mat-error *ngIf="f['email']?.errors?.['required']">
        Email is required.
      </mat-error>
      <mat-error *ngIf="f['email']?.errors?.['email']">
        Enter a valid email.
      </mat-error>
    </mat-form-field>

    <mat-form-field appearance="outline" class="full-width">
      <mat-label>Password</mat-label>
      <input matInput [type]="hidePassword ? 'password' : 'text'" formControlName="password" />
      <button mat-icon-button matSuffix type="button" (click)="hidePassword = !hidePassword">
        <mat-icon>{{ hidePassword ? 'visibility_off' : 'visibility' }}</mat-icon>
      </button>
      <mat-error *ngIf="f['password']?.errors?.['required']">
        Password is required.
      </mat-error>
      <mat-error *ngIf="f['password']?.errors?.['minlength']">
        Must be at least 6 characters.
      </mat-error>
    </mat-form-field>

    <button mat-raised-button color="primary" class="full-width" type="submit" [disabled]="loginForm.invalid">
      Login
    </button>
  </form>
</mat-card>
